name: Build Debug APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="${SDK_ROOT:+$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager}"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found on the GitHub runner" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Test and build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon
          ./gradlew testDebugUnitTest assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
